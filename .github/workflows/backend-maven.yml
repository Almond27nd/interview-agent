name: Java CI

on:
  push:
    branches: [ main, chore/ci-and-lombok-version ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '21' ]

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Build with Maven
        working-directory: interview-agent-java
        run: mvn -B -V -e clean package
